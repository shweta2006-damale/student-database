<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Database</title>
<style>
body{font-family:sans-serif;background:#f0f4ff;display:flex;justify-content:center;padding:20px;margin:0}
.box{background:white;padding:20px;border-radius:16px;width:100%;max-width:400px;box-shadow:0 8px 20px #0001}
h2{text-align:center;color:#4f46e5}
input{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:12px;background:#4f46e5;color:white;border:none;border-radius:10px;margin-top:8px;font-weight:bold}
button.del{background:#ef4444;width:auto;padding:6px 10px;margin:0}
table{width:100%;margin-top:15px;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid #eee;padding:8px;text-align:left}
#search{margin-top:15px;background:#f8f8ff}
</style>
</head>
<body>
<div class="box">
<h2>📚 Student Database</h2>
<input id="name" placeholder="Name">
<input id="roll" placeholder="Roll No">
<input id="std" placeholder="Class">
<input id="marks" placeholder="Marks" type="number">
<button onclick="addStudent()">Add Student</button>
<input id="search" placeholder="Search name..." onkeyup="searchStudent()">
<table id="table"></table>
</div>

<script>
let students = JSON.parse(localStorage.getItem("students")||"[]");
show();
function addStudent(){
  let n=document.getElementById("name").value.trim();
  let r=document.getElementById("roll").value.trim();
  let s=document.getElementById("std").value.trim();
  let m=document.getElementById("marks").value.trim();
  if(!n) return alert("Name tak");
  students.push({name:n,roll:r,std:s,marks:m});
  localStorage.setItem("students",JSON.stringify(students));
  document.getElementById("name").value="";document.getElementById("roll").value="";document.getElementById("std").value="";document.getElementById("marks").value="";
  show();
}
function show(list=students){
  let t=document.getElementById("table");
  t.innerHTML="<tr><th>Name</th><th>Roll</th><th>Class</th><th>Marks</th><th></th></tr>";
  list.forEach((x,i)=>{
    t.innerHTML+=`<tr><td>${x.name}</td><td>${x.roll}</td><td>${x.std}</td><td>${x.marks}</td><td><button class='del' onclick='del(${i})'>X</button></td></tr>`;
  });
}
function del(i){students.splice(i,1);localStorage.setItem("students",JSON.stringify(students));show();}
function searchStudent(){
  let q=document.getElementById("search").value.toLowerCase();
  show(students.filter(s=>s.name.toLowerCase().includes(q)));
}
</script>
</body>
</html>
